image boot.vfat {
	vfat {
		files = {
			"Image",
			"sun300i-v821-avaota-f1.dtb"
		}
		file extlinux/extlinux.conf {
			image = extlinux.conf
		}
	}

	size = 64M
}

image sdcard.img {
	hdimage {
	}

	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
	}

	partition boot {
		partition-type = 0x0c
		bootable = "true"
		image = "boot.vfat"
		offset = 1M
	}

	partition rootfs {
		partition-type = 0x83
		image = "rootfs.ext4"
	}
}
